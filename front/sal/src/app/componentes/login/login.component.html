<div class="page-wrapper">
  <app-sidebar></app-sidebar>

  <main class="content">
    <div class="login">
      <h2>Login</h2>
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" class="form-control" id="email" [(ngModel)]="email">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" [(ngModel)]="password">
      </div>

      <button type="submit" class="btn btn-primary" (click)="iniciar()">Iniciar Sesión</button>
    </div>
  </main>

  <app-footer></app-footer>
</div>
