<app-sidebar></app-sidebar>

<div class="page-wrapper">
  <main class="content">
    <div class="registro">
      <h2>Registro</h2>

      <div class="form-group">
        <label for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" [(ngModel)]="nombre">
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" class="form-control" id="email" [(ngModel)]="email">
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" class="form-control" id="password" [(ngModel)]="password">
      </div>

      <button type="submit" class="btn btn-primary" (click)="registrar()">Registro</button>
    </div>
  </main>

  <app-footer></app-footer>
</div>
